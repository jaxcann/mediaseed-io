<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STORY — movement core</title>
  <script type="module" crossorigin src="/magic/assets/index-CpT_AhsU.js"></script>
  <link rel="stylesheet" crossorigin href="/magic/assets/index-Do-n0Y4U.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="badge">STORY <span>v0.6 · the run</span></div>
    <div id="hint"><b>Click to play</b>&ensp;·&ensp;<b>WASD</b> move&ensp;·&ensp;<b>Space</b> jump&ensp;·&ensp;<b>Shift</b> dash&ensp;·&ensp;<b>LMB</b>/<b>RMB</b> cast&ensp;·&ensp;<b>scroll</b> swaps magic&ensp;·&ensp;hold <b>Q</b> for the wheel</div>
    <div id="combo"><b id="combo-n"></b><i id="combo-tag"></i></div>
    <div id="player">
      <div id="pl-top">
        <svg id="pl-sigil" viewBox="0 0 100 100" width="46" height="46"><path id="pl-glyph"/></svg>
        <div id="pl-text">
          <b id="school-name"></b>
          <i id="school-keys"></i>
        </div>
      </div>
      <div id="pl-bars">
        <div class="pl-bar hp"><span id="hp-fill2"></span><em>HEALTH</em><u id="hp-num"></u></div>
        <div class="pl-bar fl"><span id="fl-fill"></span><em>FLOW</em></div>
      </div>
      <div id="pl-slots"></div>
    </div>
    <div id="prompt"></div>
    <div id="switch"><svg viewBox="0 0 100 100" width="34" height="34"><path id="sw-glyph"/></svg><b id="sw-name"></b></div>
    <div id="banner">
      <i id="banner-round"></i>
      <b id="banner-name"></b>
      <em id="banner-sub"></em>
    </div>
    <div id="foe">
      <b id="foe-name"></b>
      <div id="foe-bar"><span id="foe-fill"></span></div>
    </div>
    <div id="purse"><b id="coins">0</b><i>coins</i><em id="best"></em></div>
    <div id="callout"></div>
    <div id="shop">
      <div id="shop-panel">
        <header>
          <span class="shop-mark">✦</span>
          <h3>THE MAGIC HUT</h3>
          <span id="shop-purse"></span>
        </header>
        <ul id="shop-list"></ul>
        <p id="shop-foot"></p>
      </div>
    </div>
    <div id="vitals">
      <div id="hp-bar"><span id="hp-fill"></span></div>
      <i id="hp-label">VITALITY</i>
    </div>
    <div id="wheel">
      <svg viewBox="-260 -260 520 520" width="520" height="520">
        <defs>
          <radialGradient id="wheel-veil">
            <stop offset="0%" stop-color="rgba(14,9,22,0.72)" />
            <stop offset="62%" stop-color="rgba(14,9,22,0.5)" />
            <stop offset="100%" stop-color="rgba(14,9,22,0)" />
          </radialGradient>
        </defs>
        <circle r="250" fill="url(#wheel-veil)" />
        <g id="wheel-ring-a" class="wheel-runes"></g>
        <g id="wheel-ring-b" class="wheel-runes dim"></g>
        <circle class="wheel-circle" r="186" />
        <circle class="wheel-circle faint" r="212" />
        <circle class="wheel-circle faint" r="74" />
        <g id="wheel-nodes"></g>
        <text id="wheel-name" y="8" text-anchor="middle"></text>
        <text id="wheel-blurb" y="228" text-anchor="middle"></text>
        <text id="wheel-primary" y="248" text-anchor="middle"></text>
        <text id="wheel-secondary" y="263" text-anchor="middle"></text>
      </svg>
    </div>
    <svg id="reticle" viewBox="0 0 64 64" width="64" height="64">
      <circle class="ret-track" cx="32" cy="32" r="15" />
      <circle id="ret-flow" cx="32" cy="32" r="15" transform="rotate(-90 32 32)" />
      <circle id="ret-charge" cx="32" cy="32" r="9" transform="rotate(-90 32 32)" />
      <circle id="ret-dot" cx="32" cy="32" r="2.1" />
    </svg>
    <div id="fps"></div>
    <div id="speed"></div>
    <div id="toast"></div>
  </div>
</body>
</html>
